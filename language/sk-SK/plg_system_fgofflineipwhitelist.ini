; Package: FG.Plugin.System.Fgofflineipwhitelist
PLG_SYSTEM_FGOFFLINEIPWHITELIST="System - FG Offline IP Whitelist"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_LABEL="Vaša detegovaná IP"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_DESC="Zobrazuje IP adresu, ktorú plugin práve pre vás deteguje, vyhodnotenú presne tou istou logikou, akú používa za behu (vrátane neuložených zmien Trust X-Forwarded-For / Trusted proxy IPs / Client IP header na tomto formulári). Užitočné pri hľadaní správnej hodnoty do Allowed IP addresses nižšie - po zmene nastavení proxy formulár uložte, aby sa tento náhľad obnovil."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_TEXT="Detegovaná IP:"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_DIRECT="Detegované priamo z pripojenia (Trust X-Forwarded-For je vypnuté, alebo pripojený klient nie je dôveryhodná proxy)."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_DETECTED_IP_VIA_PROXY="Vyhodnotené z nastavenej hlavičky s IP klienta, cez dôveryhodnú proxy %s."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_ALLOWED_IPS_LABEL="Povolené IP adresy"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_ALLOWED_IPS_DESC="Jeden záznam na riadok (alebo oddelené čiarkou). Podporuje presné IPv4/IPv6 adresy aj CIDR rozsahy, napr. 203.0.113.5 alebo 192.168.1.0/24. Tieto IP adresy uvidia živý web aj počas zapnutého Site Offline módu."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUST_XFF_LABEL="Dôverovať hlavičke X-Forwarded-For"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUST_XFF_DESC="Zapnite iba ak web beží za reverse proxy alebo CDN (napr. Cloudflare, nginx). Ak je zapnuté, hlavička sa akceptuje len vtedy, keď je IP adresa priamo pripojeného klienta (proxy) uvedená nižšie v zozname Dôveryhodné proxy IP adresy - to zabraňuje obídeniu whitelistu podvrhnutím hlavičky."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUSTED_PROXIES_LABEL="Dôveryhodné proxy IP adresy"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_TRUSTED_PROXIES_DESC="Jeden záznam na riadok (alebo oddelené čiarkou). IP adresy alebo CIDR rozsahy vašej reverse proxy/CDN. Bez vyplnenia tohto zoznamu sa Trust X-Forwarded-For neuplatní - hlavička X-Forwarded-For sa úplne ignoruje a použije sa priamo IP adresa pripojeného klienta. Ak je v reťazci viacero proxy, hlavička sa overuje krok za krokom od pripojeného klienta smerom späť; použije sa iba IP adresa za poslednou dôveryhodnou proxy, takže nedôveryhodný článok skôr v reťazci nemôže výsledok podvrhnúť."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_LABEL="Hlavička s IP klienta"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_DESC="Ktorá hlavička nesie skutočnú IP adresu návštevníka. X-Forwarded-For je univerzálny štandard používaný väčšinou reverse proxy. CF-Connecting-IP a True-Client-IP sú jednohodnotové hlavičky nastavované priamo Cloudflare (a pri druhej menovanej aj niektorými ďalšími CDN/Akamai) - použite niektorú z nich, ak ju vaše CDN nastavuje, keďže nevyžaduje analýzu reťazca. Všetky voľby sa uplatnia len vtedy, keď pripojený klient sedí so zoznamom Dôveryhodné proxy IP adresy vyššie."
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_OPT_XFF="X-Forwarded-For"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_OPT_CF="CF-Connecting-IP (Cloudflare)"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_IP_HEADER_OPT_TCI="True-Client-IP (Cloudflare Enterprise / Akamai)"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_LOG_ACCESS_LABEL="Logovať obídenia whitelistom"
PLG_SYSTEM_FGOFFLINEIPWHITELIST_FIELD_LOG_ACCESS_DESC="Pri každom obídení offline obrazovky návštevníkom z whitelistu sa zapíše záznam do Joomla logu (kategória fgofflineipwhitelist)."
